name: AI Data Pipeline Orchestrator

on:
  schedule:
    # Trigger every Monday at 1:30 AM UTC / 7:00 AM IST
    - cron: '30 1 * * 1'
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Reason for running the pipeline manually'
        required: false
        default: 'Manual trigger'

jobs:
  run-pipeline:
    name: Execute End-to-End Ingestion & Processing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Data Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          LOG_LEVEL: INFO
        run: |
          python main.py
